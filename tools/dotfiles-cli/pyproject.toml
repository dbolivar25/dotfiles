[project]
name = "daniel-dotfiles-cli"
version = "0.1.0"
description = "Safe orchestration for Daniel's Stow-managed dotfiles"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.1"]

[project.scripts]
dotfiles = "dotfiles_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dotfiles_cli"]
