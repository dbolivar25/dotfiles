version = 1
mode = "shadow-validation"
shells = ["fish", "zsh", "nu"]

# Portable path prefixes used only to classify shell-resolved executables.
[owners.mise]
path_prefixes = ["${HOME}/.local/share/mise/installs/", "${HOME}/.mise/installs/"]

[owners.uv]
path_prefixes = ["${HOME}/.local/share/uv/python/"]

[owners.rustup]
path_prefixes = ["${HOME}/.rustup/toolchains/", "${HOME}/.cargo/bin/"]

[owners.opam]
path_prefixes = ["${HOME}/.opam/"]

[owners.ghcup]
path_prefixes = ["${HOME}/.ghcup/"]

[owners.bun]
path_prefixes = ["${HOME}/.bun/"]

[owners.dotnet]
path_prefixes = ["${HOME}/.dotnet/", "/usr/local/share/dotnet/"]

[owners.nvm]
path_prefixes = ["${HOME}/.nvm/", "${HOME}/.config/nvm/", "${HOME}/.local/share/nvm/"]

[owners.rbenv]
path_prefixes = ["${HOME}/.rbenv/"]

[owners.homebrew]
path_prefixes = ["/opt/homebrew/", "/usr/local/Cellar/", "/usr/local/opt/"]

[owners.manual]
path_prefixes = ["/usr/local/go/", "/usr/local/bin/"]

[owners.system]
path_prefixes = ["/usr/bin/", "/bin/", "/usr/sbin/", "/sbin/"]

[[runtimes]]
name = "node"
commands = ["node"]
owner = "mise"
phase = "shadow"
global_version = "lts"
idiomatic_version_file = true
legacy_owners = ["nvm", "homebrew", "manual", "system"]
gates = ["retire legacy Node activation and stores only after an observation window"]

[[runtimes]]
name = "ruby"
commands = ["ruby", "bundle"]
owner = "mise"
phase = "shadow"
global_version = "3.3.1"
legacy_owners = ["rbenv", "homebrew", "system"]
gates = ["retire legacy Ruby packages and stores only after an observation window"]

[[runtimes]]
name = "go"
commands = ["go"]
owner = "mise"
phase = "shadow"
global_version = "1.23.11"
legacy_owners = ["manual", "homebrew", "system"]
gates = ["retire the manual Go installation only after an observation window"]

# Java is application-owned rather than a global shell runtime: Homebrew
# launchers provide OpenJDK where needed, and Trader Workstation bundles a JRE.

[[runtimes]]
name = "elixir"
commands = ["elixir", "mix"]
owner = "mise"
phase = "shadow"
global_version = "1.19.5-otp-28"
legacy_owners = ["homebrew", "system"]
gates = ["fix retained project warnings and the light_controller route test before claiming project parity", "retire Homebrew Elixir only after an observation window"]

[[runtimes]]
name = "erlang"
commands = ["erl"]
owner = "mise"
phase = "shadow"
global_version = "28.5"
legacy_owners = ["homebrew", "system"]
gates = ["keep Homebrew Erlang while Gleam depends on it"]

# uv owns project-selected Python interpreters, not global python commands.

[[runtimes]]
name = "rust"
commands = ["rustc", "cargo"]
owner = "rustup"
phase = "retained"
legacy_owners = ["homebrew", "system", "mise"]
gates = []

[[runtimes]]
name = "ocaml"
commands = ["ocaml"]
owner = "opam"
phase = "retained"
legacy_owners = ["homebrew", "system", "mise"]
gates = ["restore representative project tooling before claiming project parity", "use opam exec in Nushell until a native adapter exists"]

[[runtimes]]
name = "haskell"
commands = ["ghc", "cabal", "stack"]
owner = "ghcup"
phase = "retained"
legacy_owners = ["homebrew", "system", "mise"]
gates = []

[[runtimes]]
name = "bun"
commands = ["bun"]
owner = "bun"
phase = "retained"
legacy_owners = ["homebrew", "system", "mise"]
gates = []

[[runtimes]]
name = "dotnet"
commands = ["dotnet"]
owner = "dotnet"
phase = "retained"
legacy_owners = ["homebrew", "system", "mise"]
gates = []
